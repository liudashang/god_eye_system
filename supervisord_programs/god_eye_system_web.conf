[program:god_eye_system_web]
environment=PYTHONPATH=/home/super/.local/lib/python3.10/site-packages
directory=/web/god_eye_system
command= /home/super/.local/bin/gunicorn autoapp:app -b :5002 -w 4 -k gevent --max-requests=5000 --max-requests-jitter=500 --log-level=debug
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/god_eye_system_web_stdout
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/god_eye_system_web_stderr
stderr_logfile_maxbytes=0
user=super
