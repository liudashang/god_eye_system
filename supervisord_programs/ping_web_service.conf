[program:ping_web_service]
environment=PYTHONPATH=/home/super/.local/lib/python3.10/site-packages
directory=/web/god_eye_system/ping_web_service
command= /home/super/.local/bin/gunicorn app:app -b :5000 -w 2 -k gevent --max-requests=5000 --max-requests-jitter=500 --log-level=debug
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/tmp/ping_web_service_stdout
stdout_logfile_maxbytes=0
stderr_logfile=/tmp/ping_web_service_stderr
stderr_logfile_maxbytes=0
user=super
