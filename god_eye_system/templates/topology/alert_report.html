{% extends "layout.html" %}
{% block css %}
<link rel="stylesheet" type="text/css" href="{{ static_url_for('static', filename='css/daterangepicker.css') }}" />
<style>
    table {
        font-size: 12px;
    }
    
    div.seperate-line {
        background-color: rgb(182, 219, 219);
        text-align: center;
    }
</style>
{% endblock %}

{% block content %}
<div class="container">
    <div class="seperate-line">
        <h5>{{ topology_name }}告警历史记录查询</h5>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="form-group">
                <label for="">选择时间范围</label>
                <input type="text" class="form-control" name="timerange" id="timerange" aria-describedby="helpId"
                    placeholder="">
            </div>
            <button type="button" id="query_alert_report" class="btn btn-primary">查询</button>
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <table id="alerts_table" data-toggle="table" data-locale="zh-CN" data-click-to-select="true" data-show-export="true"
                data-server-sort="false" data-height="500" data-search="true" data-search-align="left" data-export-data-type="all">
                <thead>
                    <tr>
                        <th data-field="state" data-checkbox="true"></th>
                        <th data-field="alert_host" data-sortable="true">告警主机</th>
                        <th data-field="alert_level" data-sortable="true">告警级别</th>
                        <th data-field="alert_info" data-sortable="true">告警信息</th>
                        <th data-field="alert_time" data-sortable="true">告警时间</th>
                    </tr>
                </thead>
            </table>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script src="{{ static_url_for('static', filename='js/moment-with-locales.js') }}"></script>
<script src="{{ static_url_for('static', filename='js/daterangepicker.js') }}"></script>
<script>
    const topology_name = "{{ topology_name }}";
    var from = moment().subtract(3, 'hour').format('YYYY-MM-DD HH:mm:ss');
    var to = moment().format('YYYY-MM-DD HH:mm:ss');
    $(function () {
        $('#timerange').daterangepicker({
            timePicker: true,
            timePickerSeconds: true,
            timePicker24Hour: true,
            startDate: moment().subtract(3, 'hour'),
            endDate: moment(),
            locale: {
                format: 'YYYY-MM-DD HH:mm:ss',
                applyLabel: '确定', //确定按钮文本
                cancelLabel: '取消', //取消按钮文本
                daysOfWeek: ['日', '一', '二', '三', '四', '五', '六'],
                monthNames: ['一月', '二月', '三月', '四月', '五月', '六月',
                    '七月', '八月', '九月', '十月', '十一月', '十二月'],
                firstDay: 1
            }
        }, (start, end, lable) => {
            from = start.format('YYYY-MM-DD HH:mm:ss');
            to = end.format('YYYY-MM-DD HH:mm:ss');
            console.log(start.format('X'), end.format('X'));
            console.log(start.format('x'), end.format('x'));
        });

        $("#query_alert_report").click(function (e) { 
            e.preventDefault();
            $("#alerts_table").bootstrapTable('refresh', { url: `{{url_for('topology.get_alert_report')}}?to=${to}&from=${from}&topology_name=${topology_name}` });
        });

    });
</script>
{% endblock %}
