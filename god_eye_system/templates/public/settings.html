{% extends "layout.html" %}
{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    AD设置
                </div>
                <div class="card-body">
                    <form id="configuration">
                        <div class="form-group">
                            <label for="">LDAP服务器地址</label>
                            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />
                            <input type="text" class="form-control" name="ldap_address" id="ldap_address"
                                placeholder="">
                        </div>
                        <div class="form-group">
                            <label for="">LDAP认证账户</label>
                            <input type="text" class="form-control" name="ldap_account" id="ldap_account"
                                placeholder="">
                        </div>
                        <div class="form-group">
                            <label for="">LDAP认证密码</label>
                            <input type="password" class="form-control" name="ldap_password" id="ldap_password"
                                placeholder="">
                        </div>
                        <button type="button" class="btn btn-primary" id="setting_form_submit">保存</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    说明书设置
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label for="">说明书上传</label>
                        <input type="file" class="form-control-file" id="user_guide">
                    </div>
                    <button type="button" class="btn btn-primary" id="user_guide_submit">保存</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block js %}
<script>
    $(function () {
        //初始化：
        $("#nav_li_system").addClass("active");
        $("#ldap_address").val("{{data[0]}}");
        $("#ldap_account").val("{{data[1]}}");

        //提交事件：
        $("#setting_form_submit").click(function (e) {
            $.post("/api/settings", $("#configuration").serializeArray(), function (data) {
                if (data.error == 1) {
                    toastr.warning(data.info);
                } else {
                    toastr.success(data.info);
                }
            });
        });

        $('#user_guide_submit').click(function () {
            var files = $('#user_guide')[0].files[0] //单个

            var data = new FormData();
            data.append('csrf_token',"{{csrf_token()}}")
            data.append('file', files);

            $.ajax({
                url: '{{url_for("public.upload_user_guide")}}',
                type: 'POST',
                data: data,
                cache: false,
                processData: false,
                contentType: false,
                success: data => {
                    api_result(data)
                }
            });
        });
    });
</script>
{% endblock %}
